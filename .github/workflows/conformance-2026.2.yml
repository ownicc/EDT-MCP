name: Conformance 2026.2

# Thin per-version caller of the reusable MCP conformance gate (conformance.yml) so EDT
# 2026.2 gets its OWN status badge. See conformance.yml for what the gate does.

on:
  pull_request:
    branches: [master]
    paths:
      - 'mcp/**'
      - 'tests/conformance/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/conformance-2026.2.yml'
      - '.github/workflows/conformance.yml'
      - '.gitattributes'
  push:
    branches: [master]
    paths:
      - 'mcp/**'
      - 'tests/conformance/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/conformance-2026.2.yml'
      - '.github/workflows/conformance.yml'
      - '.gitattributes'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance:
    uses: ./.github/workflows/conformance.yml
    with:
      edt: "2026.2"
